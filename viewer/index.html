<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABAQUS MCP Pro - 3D Result Viewer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }
  #app { display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar { width: 280px; min-width: 280px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #0f3460; }
  #sidebar-header { padding: 16px; border-bottom: 1px solid #0f3460; }
  #sidebar-header h2 { font-size: 15px; font-weight: 600; color: #e94560; letter-spacing: 0.5px; }
  #sidebar-header .subtitle { font-size: 11px; color: #888; margin-top: 2px; }
  #file-input-area { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
  #file-input-area label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; }
  #file-input { width: 100%; padding: 8px; background: #0f3460; border: 1px solid #1a1a4e; border-radius: 4px; color: #ccc; font-size: 12px; cursor: pointer; }
  #file-input::-webkit-file-upload-button { background: #e94560; border: none; color: white; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 11px; margin-right: 8px; }
  #odb-export-area { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
  #odb-export-area label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; }
  #odb-path { width: 100%; padding: 8px; background: #0f3460; border: 1px solid #1a1a4e; border-radius: 4px; color: #ccc; font-size: 12px; }
  #odb-path::placeholder { color: #555; }
  #export-btn { width: 100%; margin-top: 8px; padding: 8px; background: #e94560; border: none; border-radius: 4px; color: white; font-size: 12px; cursor: pointer; font-weight: 600; transition: background 0.15s; }
  #export-btn:hover { background: #d63850; }
  #export-btn:disabled { background: #555; cursor: not-allowed; }
  #export-status { margin-top: 6px; font-size: 11px; color: #888; min-height: 16px; }
  #export-status.success { color: #4caf50; }
  #export-status.error { color: #e94560; }
  #tree { flex: 1; overflow-y: auto; padding: 8px 0; }
  .tree-item { padding: 5px 16px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #aaa; transition: background 0.15s; }
  .tree-item:hover { background: #0f3460; }
  .tree-item.active { background: #e94560; color: white; }
  .tree-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .tree-section { padding: 8px 16px 3px; font-size: 10px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.8px; }

  /* Main viewport */
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }

  /* Toolbar */
  #toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 10; }
  #toolbar button { background: #16213e; border: 1px solid #0f3460; color: #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.15s; }
  #toolbar button:hover { background: #0f3460; border-color: #e94560; }
  #toolbar button.active { background: #e94560; border-color: #e94560; color: white; }

  /* Legend */
  #legend { position: absolute; bottom: 24px; right: 24px; background: #16213ebb; backdrop-filter: blur(8px); border: 1px solid #0f3460; border-radius: 6px; padding: 12px 14px; z-index: 10; min-width: 180px; }
  #legend-title { font-size: 11px; font-weight: 600; margin-bottom: 8px; color: #ccc; }
  #legend-gradient { height: 14px; border-radius: 3px; margin-bottom: 4px; }
  #legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #888; }

  /* Info overlay */
  #info { position: absolute; top: 12px; right: 12px; background: #16213ebb; backdrop-filter: blur(8px); border: 1px solid #0f3460; border-radius: 6px; padding: 10px 14px; z-index: 10; font-size: 11px; }
  #info .val { color: #e94560; font-weight: 600; }

  /* Animation bar */
  #anim-bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: #16213ebb; backdrop-filter: blur(8px); border: 1px solid #0f3460; border-radius: 6px; padding: 8px 16px; z-index: 10; display: flex; align-items: center; gap: 10px; }
  #anim-bar.hidden { display: none; }
  #anim-bar button { background: none; border: 1px solid #0f3460; color: #ccc; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
  #anim-bar button:hover { background: #0f3460; }
  #anim-bar input[type=range] { width: 160px; accent-color: #e94560; }
  #anim-bar .frame-label { font-size: 11px; color: #888; min-width: 50px; text-align: center; }

  /* Drop zone */
  #drop-zone { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
  #drop-zone .msg { background: #16213ecc; border: 2px dashed #0f3460; border-radius: 12px; padding: 32px 48px; text-align: center; color: #888; font-size: 14px; }
  #drop-zone .msg .icon { font-size: 36px; margin-bottom: 8px; }
  #drop-zone.hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>ABAQUS MCP Pro</h2>
      <div class="subtitle">3D Result Viewer</div>
    </div>
    <div id="file-input-area">
      <label>Load result_mesh.json</label>
      <input type="file" id="file-input" accept=".json">
    </div>
    <div id="odb-export-area">
      <label>Or export from ODB (requires Abaqus)</label>
      <input type="text" id="odb-path" placeholder="e.g. C:\jobs\my_job.odb">
      <button id="export-btn">Export from ODB</button>
      <div id="export-status"></div>
      <div id="load-exported" style="display:none; margin-top:6px;"><button id="load-exported-btn" style="width:100%;padding:6px;background:#0f3460;border:1px solid #1a1a4e;border-radius:4px;color:#ccc;font-size:11px;cursor:pointer;">Load exported JSON</button></div>
    </div>
    <div id="tree"></div>
  </div>
  <div id="viewport">
    <div id="drop-zone">
      <div class="msg">
        <div class="icon">📂</div>
        <div>Drop result_mesh.json here<br>or use the sidebar to load a file</div>
      </div>
    </div>
    <div id="toolbar">
      <button id="btn-wireframe" title="Toggle wireframe">Wireframe</button>
      <button id="btn-deformed" title="Toggle deformed shape">Deformed</button>
      <button id="btn-reset" title="Reset view">Reset</button>
      <button id="btn-top" title="Top view">Top</button>
      <button id="btn-front" title="Front view">Front</button>
      <button id="btn-right" title="Right view">Right</button>
    </div>
    <div id="legend">
      <div id="legend-title">Mises Stress (MPa)</div>
      <div id="legend-gradient"></div>
      <div id="legend-labels"><span id="legend-min">0</span><span id="legend-max">0</span></div>
    </div>
    <div id="info">
      <div>Nodes: <span class="val" id="info-nodes">-</span></div>
      <div>Elements: <span class="val" id="info-elems">-</span></div>
      <div>Frames: <span class="val" id="info-frames">-</span></div>
    </div>
    <div id="anim-bar" class="hidden">
      <button id="btn-prev">◀◀</button>
      <button id="btn-play">▶</button>
      <button id="btn-next">▶▶</button>
      <input type="range" id="frame-slider" min="0" max="0" value="0" step="1">
      <span class="frame-label" id="frame-label">0 / 0</span>
      <span style="font-size:10px;color:#888;" id="frame-time">t=0.00</span>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
