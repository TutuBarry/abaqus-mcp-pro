name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with pyflakes
        run: |
          pip install pyflakes
          pyflakes src/abaqus_mcp_pro/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build viewer assets
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*

      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/abaqus-wheel
          /tmp/abaqus-wheel/bin/pip install dist/*.whl
          /tmp/abaqus-wheel/bin/python tests/wheel_smoke.py
