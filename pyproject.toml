[project]
name = "abaqus-mcp-pro"
version = "1.0.0"
description = "ABAQUS MCP Pro - Professional MCP server suite for Abaqus/CAE with 100+ tools, dual transport, capsule tracking, physics contracts, and skills integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ABAQUS MCP Pro Contributors"},
]
keywords = ["abaqus", "mcp", "automation", "cae", "finite-element", "ai", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.0.0",
    "anyio>=3.0.0",
]

[project.scripts]
abaqus-mcp-pro-server = "abaqus_mcp_pro.server:main"
abaqus-mcp-pro-check = "abaqus_mcp_pro.cli:check_main"
abaqus-mcp-pro-doctor = "abaqus_mcp_pro.cli:doctor_main"
abaqus-mcp-pro-setup = "abaqus_mcp_pro.cli:setup_main"

[project.urls]
Homepage = "https://github.com/TutuBarry/abaqus-mcp-pro"
Repository = "https://github.com/TutuBarry/abaqus-mcp-pro"
Issues = "https://github.com/TutuBarry/abaqus-mcp-pro/issues"
Documentation = "https://github.com/TutuBarry/abaqus-mcp-pro#readme"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abaqus_mcp_pro"]
