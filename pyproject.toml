[project]
name = "abaqus-mcp-pro"
version = "1.1.0rc2"
description = "ABAQUS MCP Pro - Professional MCP server suite for Abaqus/CAE with 100+ tools, dual transport, capsule tracking, physics contracts, and skills integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ABAQUS MCP Pro Contributors"},
]
keywords = ["abaqus", "mcp", "automation", "cae", "finite-element", "ai", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.1,<3",
    "anyio>=3.0.0",
]

[project.scripts]
abaqus-mcp-pro-server = "abaqus_mcp_pro.server:main"
abaqus-mcp-pro-check = "abaqus_mcp_pro.cli:check_main"
abaqus-mcp-pro-doctor = "abaqus_mcp_pro.cli:doctor_main"
abaqus-mcp-pro-setup = "abaqus_mcp_pro.cli:setup_main"
abaqus-mcp-pro-viewer = "abaqus_mcp_pro.viewer.serve_viewer:main"
abaqus-mcp-pro-verify = "abaqus_mcp_pro.workflow:main"
abaqus-mcp-pro-project = "abaqus_mcp_pro.projects:main"

[project.urls]
Homepage = "https://github.com/TutuBarry/abaqus-mcp-pro"
Repository = "https://github.com/TutuBarry/abaqus-mcp-pro"
Issues = "https://github.com/TutuBarry/abaqus-mcp-pro/issues"
Documentation = "https://github.com/TutuBarry/abaqus-mcp-pro#readme"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0"]
pywinauto = ["pywinauto>=0.6.8", "pygetwindow>=0.0.9", "psutil>=5.9.0", "pywin32>=305"]
noninvasive = ["pywinauto>=0.6.8", "pygetwindow>=0.0.9", "psutil>=5.9.0", "pywin32>=305"]
docs = ["sentence-transformers>=2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abaqus_mcp_pro"]


[tool.hatch.build.targets.wheel.force-include]
"skills" = "abaqus_mcp_pro/data/skills"
"examples/verification" = "abaqus_mcp_pro/data/verification"
"viewer/__init__.py" = "abaqus_mcp_pro/viewer/__init__.py"
"viewer/serve_viewer.py" = "abaqus_mcp_pro/viewer/serve_viewer.py"
"viewer/export/__init__.py" = "abaqus_mcp_pro/viewer/export/__init__.py"
"viewer/export/export_to_vtk.py" = "abaqus_mcp_pro/viewer/export/export_to_vtk.py"
"viewer/export/_vtu_mcp_helper.py" = "abaqus_mcp_pro/viewer/export/_vtu_mcp_helper.py"
"viewer/export/run_export.py" = "abaqus_mcp_pro/viewer/export/run_export.py"
"viewer/dist" = "abaqus_mcp_pro/viewer/dist"
"viewer/samples" = "abaqus_mcp_pro/viewer/samples"

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "__pycache__", ".capsules", "dev", "MechAgent", "py"]

[tool.hatch.build.targets.sdist.force-include]
"viewer/dist" = "viewer/dist"

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]
